[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentflow"
version = "0.1.0"
description = "AgentFlow - Multi-agent job-search copilot with human-in-the-loop approval and grounded workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "AgentFlow Core Team" }
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.5",
    "langgraph>=0.0.60",
    "langchain-core>=0.2.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.2.0",
    "pdfplumber>=0.11.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    ".",
    "packages/contracts",
    "packages/db",
    "services/api",
    "services/orchestrator"
]
asyncio_mode = "auto"

