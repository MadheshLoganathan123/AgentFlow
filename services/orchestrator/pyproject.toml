[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentflow-orchestrator"
version = "0.1.0"
description = "LangGraph orchestration engine for AgentFlow multi-agent workflows"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.0.60",
    "langchain-core>=0.2.0",
    "pydantic>=2.7.0"
]

