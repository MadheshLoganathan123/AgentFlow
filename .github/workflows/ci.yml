name: AgentFlow CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -e .

      - name: Run Ruff Linter
        run: ruff check .

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund

      - name: Lint Frontend
        working-directory: apps/web
        run: npm run lint

  test-backend:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      DATABASE_URL_SYNC: "sqlite:///:memory:"
      LANGGRAPH_CHECKPOINT_SAVER: "memory"
      ENVIRONMENT: "testing"
      PYTHONPATH: "."
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          pip install -e . --no-deps

      - name: Verify Test Imports
        run: |
          python -c "import packages.db.base; import packages.db.models; import packages.db.session; print('DB models & session OK')"
          python -c "import packages.contracts; print('Contracts OK')"
          python -c "import services.orchestrator; print('Orchestrator OK')"

      - name: Run Tests with Coverage
        run: |
          python -m pytest tests/ -v --tb=short --co -q
          python -m pytest tests/ -v --tb=short

  container-build:
    name: Container Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/api/Dockerfile
          push: false
          tags: agentflow-api:test

      - name: Build Web Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: apps/web/Dockerfile
          push: false
          tags: agentflow-web:test
